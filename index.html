<body>
<main class="stage" id="cert">
  <div class="abs code">ABRAKADABRA_SPA22</div>

  <div class="abs amount">
    <input id="sum" inputmode="numeric" autocomplete="off" placeholder="Введите сумму" aria-label="Номинал сертификата">
    <span class="cur" aria-hidden="true">₽</span>
  </div>

  <div class="abs f" style="left:23.7%;top:66.6%"><input id="to" aria-label="Имя получателя" autocomplete="off"></div>
  <div class="abs f" style="left:52.4%;top:66.6%"><input id="from" aria-label="Имя дарителя" autocomplete="off"></div>
  <div class="abs master">Мастер Юлия +79132616808</div>

</main>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var sum=$('sum'),ids=['sum','to','from'];
  sum.addEventListener('input',function(){
    var d=sum.value.replace(/\D/g,'').slice(0,7);
    sum.value=d?d.replace(/\B(?=(\d{3})+(?!\d))/g,'\u00A0'):'';
  });
  function save(){
    ids.forEach(function(id){try{localStorage.setItem('spa-cert-'+id,$(id).value)}catch(e){}});
  }
  ids.forEach(function(id){
    try{var v=localStorage.getItem('spa-cert-'+id);if(v)$(id).value=v}catch(e){}
    $(id).addEventListener('input',save);
  });
    save();sum.focus();
  });
})();
</script>
</body>
