<body>
<main class="stage" id="cert">
  <canvas class="fx dust" id="dust" aria-hidden="true"></canvas>
  <div class="fx glow g1"></div><div class="fx glow g2"></div><div class="fx glow g3"></div><div class="fx glow g4"></div>
  <div class="fx shine"></div>
  <div class="m m-head"><h1>Подарочный<br>сертификат</h1><div class="orn"><i></i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5c2 3 2 7 0 11-2-4-2-8 0-11zM12 16c-3-.5-6-2.5-7-6 3 0 5.5 1.2 7 3.5M12 16c3-.5 6-2.5 7-6-3 0-5.5 1.2-7 3.5M6 19h12"/></svg><i></i></div><p class="sub">Время для себя. Время для восстановления.</p><div class="brand">Massage &amp; Spa</div></div>
  <div class="abs code">ABRAKADABRA_SPA22</div>

  <div class="m m-label">Номинал сертификата</div>
  <div class="abs amount">
    <input id="sum" inputmode="numeric" autocomplete="off" placeholder="Введите сумму" aria-label="Номинал сертификата">
    <span class="cur" aria-hidden="true">₽</span>
  </div>

  <div class="abs f" style="left:23.7%;top:66.6%"><input id="to" aria-label="Имя получателя" autocomplete="off"></div>
  <div class="abs f" style="left:52.4%;top:66.6%"><input id="from" aria-label="Имя дарителя" autocomplete="off"></div>
  <div class="abs master">Мастер Юлия +79132616808</div>
  <div class="m m-foot"><div class="orn"><i></i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5c2 3 2 7 0 11-2-4-2-8 0-11zM12 16c-3-.5-6-2.5-7-6 3 0 5.5 1.2 7 3.5M12 16c3-.5 6-2.5 7-6-3 0-5.5 1.2-7 3.5M6 19h12"/></svg><i></i></div><p>Подарите момент, который принадлежит только вам.</p></div>

</main>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var sum=$('sum'),ids=['sum','to','from'];
  sum.addEventListener('input',function(){
    var d=sum.value.replace(/\D/g,'').slice(0,7);
    sum.value=d?d.replace(/\B(?=(\d{3})+(?!\d))/g,'\u00A0'):'';
  });
  function save(){
    ids.forEach(function(id){try{localStorage.setItem('spa-cert-'+id,$(id).value)}catch(e){}});
  }
  ids.forEach(function(id){
    try{var v=localStorage.getItem('spa-cert-'+id);if(v)$(id).value=v}catch(e){}
    $(id).addEventListener('input',save);
  });
})();
</script>

 .code{margin:14px 0 0;transform:none;font:400 15px "Montserrat",sans-serif;letter-spacing:.12em}
 .m-label{margin:28px 0 12px;font:400 12px "Montserrat",sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--ink)}
 .amount{height:auto;max-width:340px;padding:14px 22px;border-radius:18px;border-color:rgba(217,177,120,.7);background:rgba(10,9,7,.55)}
 .amount input{font:400 22px "Montserrat",sans-serif}
 .amount .cur{font:300 34px "Montserrat",sans-serif}
 .f{width:100%;max-width:340px;margin-top:32px}
 .f+.f{margin-top:24px}
 .f input{font:400 16px "Montserrat",sans-serif;padding:9px 2px}
 .master{margin-top:32px;font:400 15px/1.4 "Montserrat",sans-serif;letter-spacing:.05em;text-align:center}
 .m-foot{margin-top:30px}
 .m-foot .orn{margin:0 auto 12px}
 .m-foot p{margin:0;font:400 12px/1.5 "Montserrat",sans-serif;letter-spacing:.03em;color:#d9b178}
 .gen{width:100%;max-width:340px;margin-top:26px;gap:12px}
 .gen button{font:400 14px "Montserrat",sans-serif;padding:13px 22px;border-radius:12px}
 .res{flex-direction:column}
 .res input{font:400 13px "Montserrat",sans-serif;padding:12px;border-radius:10px}
 .res button{padding:12px 20px}
}
.stage{isolation:isolate;animation:rise 1.3s ease-out both}
.fx{position:absolute;pointer-events:none}
.dust{inset:0;width:100%;height:100%}
.glow{width:9%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,176,80,.6),rgba(255,140,40,.2) 38%,transparent 70%);mix-blend-mode:screen;animation:flick 3.3s ease-in-out infinite}
.g1{left:3.7%;top:35.4%}
.g2{left:4%;top:73.2%;animation-duration:4.1s;animation-delay:-1s}
.g3{left:85%;top:36.2%;animation-duration:3.7s;animation-delay:-2s}
.g4{left:91.4%;top:48%;width:6%;animation-duration:2.9s;animation-delay:-.6s}
.shine{left:32%;top:6%;width:36%;height:31%;overflow:hidden;mix-blend-mode:overlay;-webkit-mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent);mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent)}
.shine::after{content:"";position:absolute;inset:0;width:60%;background:linear-gradient(100deg,transparent,rgba(255,238,200,.85),transparent);transform:translateX(-120%);animation:sweep 7s ease-in-out 2.2s infinite}
.stage>.m,.stage>.abs{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
.stage>.m-head{animation-delay:.15s}
.stage>.code{animation-delay:.4s}
.stage>.m-label{animation-delay:.5s}
.stage>.amount{animation:up .9s cubic-bezier(.2,.7,.2,1) .6s both,aura 4.5s ease-in-out 1.8s infinite}
.stage>.f{animation-delay:.8s}
.stage>.f+.f{animation-delay:.9s}
.stage>.master{animation-delay:1s}
.stage>.m-foot{animation-delay:1.1s}
.stage>.gen{animation-delay:1.2s}
@keyframes rise{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;translate:0 14px}to{opacity:1;translate:0 0}}
@keyframes aura{0%,100%{box-shadow:0 0 0 rgba(217,177,120,0)}50%{box-shadow:0 0 22px rgba(217,177,120,.28)}}
@keyframes sweep{0%{transform:translateX(-120%)}30%,100%{transform:translateX(220%)}}
@keyframes flick{0%,100%{opacity:.8;transform:translate(-50%,-50%) scale(1)}9%{opacity:.55;transform:translate(-50%,-50%) scale(.94)}17%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}33%{opacity:.7}46%{opacity:.95;transform:translate(-50%,-50%) scale(1.03)}61%{opacity:.6;transform:translate(-50%,-50%) scale(.96)}74%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}88%{opacity:.75}}
@keyframes shine{0%{background-position:100% 0}60%,100%{background-position:0 0}}
@keyframes breathe{0%,100%{opacity:1}22%{opacity:.82}41%{opacity:.95}63%{opacity:.78}82%{opacity:.92}}
@media (max-width:760px){.glow,.shine{display:none}.stage::before{animation:breathe 5s ease-in-out infinite}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}.dust{display:none}}
@media print{.fx{display:none}.stage,.stage>*{animation:none!important}}
@media print{.gen{display:none}}
</style>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  function enc(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
  function dec(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)))}
  var data=null;
  try{
    var m=(location.hash+'&'+location.search).match(/[#?&]d=([A-Za-z0-9_\-]+)/);
    if(m)data=JSON.parse(dec(m[1]));
  }catch(e){data=null}
  if(data){
    $('sum').value=data.s||'';$('to').value=data.t||'';$('from').value=data.f||'';
    ['sum','to','from'].forEach(function(id){var el=$(id);el.readOnly=true;el.tabIndex=-1;el.setAttribute('aria-readonly','true')});
    return;
  }
  var bar=document.createElement('div');
  bar.className='abs gen';
  bar.innerHTML='<button type="button" id="mk">Создать ссылку для подарка</button><div class="res" id="res" hidden><input id="lnk" readonly aria-label="Ссылка для получателя"><button type="button" id="cp">Копировать</button></div>';
  $('cert').appendChild(bar);
  $('mk').addEventListener('click',function(){
    var s=$('sum').value.trim(),t=$('to').value.trim(),f=$('from').value.trim();
    if(!s){$('sum').focus();return}
    var base=location.href.split('#')[0].split('?')[0];
    var l=$('lnk');
    l.value=base+'#d='+enc(JSON.stringify({s:s,t:t,f:f}));
    $('res').hidden=false;
    l.focus();l.select();
  });
  $('cp').addEventListener('click',function(){
    var l=$('lnk'),b=$('cp');
    function ok(){b.textContent='Скопировано';setTimeout(function(){b.textContent='Копировать'},2000)}
    l.focus();l.select();
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(l.value).then(ok,function(){document.execCommand('copy');ok()})}
      else{document.execCommand('copy');ok()}
    }catch(e){}
  });
})();
</script>
<script>
(function(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var c=document.getElementById('dust'),st=document.getElementById('cert');
  if(!c||!c.getContext)return;
  var x=c.getContext('2d'),W=0,H=0,P=[];
  function mk(init){return{x:Math.random()*W,y:init?Math.random()*H:H+10,r:Math.random()*1.5+.5,vy:Math.random()*.25+.08,vx:(Math.random()-.5)*.1,ph:Math.random()*6.28,sp:Math.random()*1.2+.4,a:Math.random()*.5+.3}}
  function size(){
    var r=st.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);
    W=r.width;H=r.height;c.width=Math.round(W*d);c.height=Math.round(H*d);
    x.setTransform(d,0,0,d,0,0);
    var n=Math.min(70,Math.round(W*H/16000));P=[];
    for(var i=0;i<n;i++)P.push(mk(true));
  }
  function frame(ms){
    var t=ms/1000;x.clearRect(0,0,W,H);
    for(var i=0;i<P.length;i++){
      var p=P[i];
      p.y-=p.vy;p.x+=p.vx+Math.sin(t*.5+p.ph)*.12;
      if(p.y<-10||p.x<-10||p.x>W+10){P[i]=mk(false);continue}
      var a=p.a*(.5+.5*Math.sin(t*p.sp+p.ph))*Math.max(0,Math.min(1,p.y/90,(H-p.y+10)/40));
      x.fillStyle='rgba(255,170,80,'+(a*.22)+')';x.beginPath();x.arc(p.x,p.y,p.r*3,0,6.283);x.fill();
      x.fillStyle='rgba(255,215,150,'+a+')';x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill();
    }
    requestAnimationFrame(frame);
  }
  size();
  if(window.ResizeObserver)new ResizeObserver(size).observe(st);else window.addEventListener('resize',size);
  requestAnimationFrame(frame);
})();
</script>
